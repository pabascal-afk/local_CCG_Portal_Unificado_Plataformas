<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Plataforma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow" style="width: 100%; max-width: 400px;">
        <div class="card-body p-5 text-center">
            <h4 class="fw-bold mb-4">Plataforma Unificada</h4>
            
            <button onclick="loginGoogle()" class="btn btn-outline-dark w-100 mb-4 py-2 d-flex align-items-center justify-content-center gap-2">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="20" alt="Google">
                Ingresar con cuenta Google
            </button>

            <hr class="text-secondary">

            <button class="btn btn-link text-muted text-decoration-none small w-100" onclick="document.getElementById('local-form').classList.toggle('d-none')">
                ¿Sin conexión a internet? Acceso Local
            </button>

            <form id="local-form" class="d-none mt-3 text-start">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Correo Institucional</label>
                    <input type="email" id="email" class="form-control" placeholder="usuario@colegio.edu" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">PIN Maestro</label>
                    <input type="password" id="pin" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-secondary w-100">Ingreso de Emergencia</button>
            </form>
        </div>
    </div>
    <script>

        async function loginGoogle() {
            try {
                const res = await fetch('/api/auth/gas-url');
                const data = await res.json();
                if (!data.url) {
                    Swal.fire('Configuración pendiente', 'El administrador debe configurar la URL de Apps Script en el archivo .env', 'info');
                    return;
                }
                const currentUrl = window.location.origin;
                window.location.href = data.url + "?returnUrl=" + encodeURIComponent(currentUrl);
            } catch(e) {
                Swal.fire('Error', 'No se pudo conectar al servidor local', 'error');
            }
        }
        document.getElementById('local-form').onsubmit = async function(e) {
            e.preventDefault();
            const res = await fetch('/api/auth/local', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: document.getElementById('email').value, pin: document.getElementById('pin').value })
            });
            const data = await res.json();
            if (data.error) Swal.fire('Error', data.error, 'error');
            else window.location.href = data.redirect;
        };
    </script>
</body>
</html>
