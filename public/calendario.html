<!DOCTYPE html>
<html>

<head>
<script>
  window.google = {
    script: {
      run: (() => {
        let currentSuccess = null;
        let currentFailure = null;
        
        const runObj = new Proxy({}, {
          get: function(target, prop) {
            if (prop === 'withSuccessHandler') {
               return function(handler) {
                   currentSuccess = handler;
                   return runObj;
               }
            }
            if (prop === 'withFailureHandler') {
               return function(handler) {
                   currentFailure = handler;
                   return runObj;
               }
            }
            // Real RPC call
            return function(...args) {
               const onSuccess = currentSuccess;
               const onFailure = currentFailure;
               currentSuccess = null;
               currentFailure = null;
               
               fetch('/api/rpc/' + prop, {
                   method: 'POST',
                   headers: {'Content-Type': 'application/json'},
                   body: JSON.stringify({ args })
               }).then(async res => {
                   let data;
                   try { data = await res.json(); } catch(e) { data = { error: 'Invalid JSON' }; }
                   
                   if (!res.ok) {
                       if (onFailure) onFailure(new Error(data.error || 'Error del servidor'));
                   } else {
                       if (onSuccess) onSuccess(data.result);
                   }
               }).catch(err => {
                   if (onFailure) onFailure(err);
               });
            }
          }
        });
        return runObj;
      })()
    }
  };
</script>

                      <label><input type="checkbox" class="bloque-cb" value="5"> 5</label>
                      <label><input type="checkbox" class="bloque-cb" value="6"> 6</label>
                      <label><input type="checkbox" class="bloque-cb" value="7"> 7</label>
                      <label><input type="checkbox" class="bloque-cb" value="8"> 8</label>
                      <label><input type="checkbox" class="bloque-cb" value="9"> 9</label>

                <div id="areaCursosAfectados" style="flex: 1; display: none; border-left: 1px solid #eee; padding-left: 20px;">

                    <div id="checkCursosContainer" style="font-size: 0.8em; width: 100%; max-height: 100px; overflow-y: auto; display:grid; grid-template-columns: 1fr 1fr; gap:4px;"></div>
                </div>
            </div>
          </div>
          <input type="hidden" id="inputCursos" value="TODOS">
      </div>

      <h6 style="color: #2980b9; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px;">3. Logística y Recursos</h6>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
          
          <div style="background: #f4f6f6; padding: 15px; border-radius: 6px; border: 1px solid #e5e8e8;">
              <div id="selectRecurso" style="display:none;"></div>
              <label style="font-size:0.85em; font-weight:bold; color: var(--primary);">Solicitar Espacios Institucionales</label>
              <div id="listaEspaciosCal" style="display:grid; grid-template-columns: 1fr; gap:5px; font-size:0.85em; margin-bottom: 15px; max-height: 100px; overflow-y: auto; background: white; padding: 8px; border-radius: 4px; border: 1px solid #ddd;"></div>
              
              <label style="font-size:0.85em; font-weight:bold; color: var(--primary);">Solicitar Materiales</label>
              <div id="listaMaterialesCal" style="display:grid; grid-template-columns: 1fr; gap:5px; font-size:0.85em; max-height: 100px; overflow-y: auto; background: white; padding: 8px; border-radius: 4px; border: 1px solid #ddd;"></div>
              
              <div style="font-size: 0.75em; color: #7f8c8d; margin-top: 8px;">Se enviará automáticamente un correo a cada encargado para visarlo.</div>
          </div>
          
          <div style="background: #fdfdfe; padding: 15px; border-radius: 6px; border: 1px solid #e9ecef;">
              <label style="font-size: 0.9em; font-weight: bold; color: #2980b9; display: block; margin-bottom: 10px;">
                  Invitados Externos (Requieren visación)
              </label>
              <div id="listaExternos" class="mb-2" style="max-height: 150px; overflow-y: auto;"></div>
              <button type="button" class="btn btn-sm btn-outline-secondary py-0" onclick="agregarFilaExterno()" style="font-size: 0.8em; padding: 4px 8px; cursor: pointer; width: 100%;">+ Añadir Persona Externa</button>

      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px;">
        <button type="button" onclick="cerrarModal('modalEvento')" class="btn btn-light" style="background:#f0f0f0; color:#333; border:none; padding:10px 15px; border-radius:4px; font-weight:600; cursor:pointer;">Cancelar</button>

        <input type="hidden" id="dupTexto"><input type="hidden" id="dupTipo">
        <label style="font-size:0.85em;">Nueva Fecha:</label><input type="date" id="dupFecha" class="form-control" required style="margin-top:5px;">

          <button type="button" onclick="cerrarModal('modalDuplicar')" style="background:#f0f0f0; border:none; padding:6px 12px; border-radius:4px; font-weight:600; cursor:pointer;">Cancelar</button>
          <button type="submit" id="btnDuplicarGuardar" style="background:#8e44ad; color:white; border:none; padding:6px 12px; border-radius:4px; font-weight:600; cursor:pointer;">Duplicar</button>

        <label style="font-weight:600; cursor:pointer;"><input type="checkbox" id="checkTodo" checked onchange="toggleTodo(this)"> Todo el año</label>
      </div>

        <button onclick="ejecutarExportacion('csv')" style="flex:1; background:#27ae60; color:white; padding:8px; border:none; border-radius:4px; cursor:pointer;">📊 Excel / CSV</button>

        <button onclick="cerrarModal('modalExportar')" style="background:none; border:none; text-decoration:underline; cursor:pointer; font-size:0.85em; color:#777;">Cancelar</button>

  <script>
    let eventos = [];
    let mapaColores = {}; 
    const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
    const INICIO_AÑO_ESCOLAR = new Date(2026, 1, 23); 

    let isSelectionMode = false;
    let selectedIds = new Set();
    let selectedObjects = [];
    let filtroCategoriaActual = 'Todas';
    
    let modoVista = 'lista';
    let mesCuadriculaVisible = new Date().getMonth();

    window.onload = function() { cargarTodo(); };

    function actualizarZoom(valor) {
        document.documentElement.style.setProperty('--card-width', valor + 'px');
        let val = parseInt(valor);
        let fontSize = 10 + ((val - 200) / 100); 
        if(fontSize < 11) fontSize = 11;
        if(fontSize > 18) fontSize = 18;
        document.documentElement.style.setProperty('--dynamic-font-size', fontSize + 'px');
    }

    function cargarTodo() {
          document.getElementById('calendar-grid').innerHTML = '<p style="text-align:center; margin-top:50px; color:#777;">Cargando calendario...</p>';
          
          fetch('/api/recursos/config').then(r=>r.json()).then(recursos => {
                const cont = document.getElementById('listaEspaciosCal');
                if(cont) cont.innerHTML = recursos.map(r => `<label style="margin:0;"><input type="checkbox" class="chk-esp-cal" value="${r.id}"> ${r.nombre}</label>`).join('');
            });
            fetch('/api/actividades/materiales').then(r=>r.json()).then(mats => {
                const cont = document.getElementById('listaMaterialesCal');
                if(cont) cont.innerHTML = mats.map(m => `<div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="margin:0; flex:1;"><input type="checkbox" class="chk-mat-cal" value="${m.id}" onchange="document.getElementById('cant_cal_${m.id}').disabled = !this.checked"> ${m.nombre}</label>
                    <input type="number" id="cant_cal_${m.id}" value="1" min="1" disabled style="width:45px; height:22px; font-size:0.9em; padding:0 2px; border:1px solid #ccc;">
                </div>`).join('');
            });

          google.script.run.withSuccessHandler(procesarDatos).obtenerDatosCompletos();
      }

    function procesarDatos(respuesta) {
          // Extraer cursos dinamicamente
          fetch('/api/rpc/getConfigFrontend', {method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({args:[]})})
             .then(r=>r.json()).then(data => {
                 if(data.result && data.result.cursos) {
                     renderizarCheckboxesCursos(data.result.cursos);
                 }
             }).catch(e => console.log(e));

        if(respuesta.error) { alert(respuesta.msg); return; }
        
        eventos = respuesta.eventos;
        mapaColores = respuesta.colores;
        
        // --- APLICAR SEGURIDAD UI ---
        const userLabel = document.getElementById('usuario-actual') || crearLabelUsuario();
        userLabel.innerText = respuesta.usuario + (respuesta.esAdmin ? " (Admin)" : " (Lector)");
        
        if (!respuesta.esAdmin) {
            document.body.classList.add('read-only');
        } else {
            document.body.classList.remove('read-only');
        }
        // -----------------------------

        generarFiltros();
        renderizar('Todas');
    }

    // Pequeña función para mostrar quién está logueado en la barra (Opcional)
    function crearLabelUsuario() {
        const div = document.createElement('div');
        div.id = 'usuario-actual';
        div.style.fontSize = '0.7em';
        div.style.color = '#7f8c8d';
        div.style.position = 'absolute';
        div.style.top = '5px';
        div.style.right = '15px';
        document.body.appendChild(div);
        return div;
    }

    function obtenerNumeroSemana(dia, mes, anio) {
        const fechaEvento = new Date(anio, mes, dia);
        const diffTime = fechaEvento - INICIO_AÑO_ESCOLAR;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        if (diffDays < 0) return -1; 
        return Math.floor(diffDays / 7) + 1;
    }

    function hexToRgba(hex, alpha) {
        let c;
        if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
            c= hex.substring(1).split('');
            if(c.length== 3){ c= [c[0], c[0], c[1], c[1], c[2], c[2]]; }
            c= '0x'+c.join('');
            return 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+','+alpha+')';
        }
        return hex;
    }

    // --- FILTROS DE FECHA ---
    function limpiarFechas() {
        document.getElementById('filtroDesde').value = '';
        document.getElementById('filtroHasta').value = '';
        const cb = document.getElementById('checkVerTodo');
        if (cb) cb.checked = false;
        renderizar(filtroCategoriaActual);
    }

    function toggleViewMode() {
        modoVista = modoVista === 'lista' ? 'cuadricula' : 'lista';
        if (modoVista === 'cuadricula') {
            document.getElementById('gridNav').style.display = 'flex';
            mesCuadriculaVisible = new Date().getMonth();
        } else {
            document.getElementById('gridNav').style.display = 'none';
        }
        renderizar('Actual');
    }

    function cambiarMesGrid(offset) {
        mesCuadriculaVisible += offset;
        if (mesCuadriculaVisible < 0) mesCuadriculaVisible = 0;
        if (mesCuadriculaVisible > 11) mesCuadriculaVisible = 11;
        renderizar('Actual');
    }

    // --- RENDERIZADO ---
    function renderizar(filtro) {
        if(filtro !== 'Actual') filtroCategoriaActual = filtro;
        else filtro = filtroCategoriaActual;

        if (modoVista === 'cuadricula') {
            renderizarCuadricula(filtro);
            return;
        }

        const contenedor = document.getElementById('calendar-grid');
        contenedor.innerHTML = '';
        contenedor.className = 'grid-container';
        actualizarBotonesFiltro(filtro);

        // Obtener valores de fecha (si existen)
        const valDesde = document.getElementById('filtroDesde').value;
        const valHasta = document.getElementById('filtroHasta').value;
        const dateDesde = valDesde ? new Date(valDesde + "T00:00:00") : null;
        const dateHasta = valHasta ? new Date(valHasta + "T23:59:59") : null;

        const cbVerTodo = document.getElementById('checkVerTodo');
        const verTodoElAno = cbVerTodo ? cbVerTodo.checked : false;
        const mesActual = new Date().getMonth();

        for(let i=0; i<12; i++) {
            // Filtrar meses pasados si no se pide ver todo y no hay un filtro manual de fechas
            if (!verTodoElAno && !dateDesde && !dateHasta && i < mesActual) {
                continue;
            }

            const eventosMes = eventos.filter(e => {
                const esMes = e.mes === i;
                const esTipo = filtro === 'Todas' ? true : e.tipo === filtro;
                
                // Filtro Fecha
                let pasaFecha = true;
                const fEvento = new Date(e.anio, e.mes, e.dia);
                if(dateDesde && fEvento < dateDesde) pasaFecha = false;
                if(dateHasta && fEvento > dateHasta) pasaFecha = false;

                return esMes && esTipo && pasaFecha;
            }).sort((a,b) => a.dia - b.dia);

            if(eventosMes.length > 0) {
                const diasAgrupados = {};
                eventosMes.forEach(ev => {
                    if(!diasAgrupados[ev.dia]) diasAgrupados[ev.dia] = [];
                    diasAgrupados[ev.dia].push(ev);
                });

                const card = document.createElement('div');
                card.className = 'month-card';
                card.id = `card-month-${i}`;
                const colorBorde = (filtro !== 'Todas' && mapaColores[filtro]) ? mapaColores[filtro] : '#ddd';
                card.style.borderTop = `4px solid ${colorBorde}`;

                let html = `<div class="month-header">${meses[i]}</div><div class="month-body">`;

                for(const dia in diasAgrupados) {
                    const grupo = diasAgrupados[dia];
                    const principal = grupo[0]; 

                    const fechaObj = new Date(principal.anio, principal.mes, principal.dia);
                    const nombreDia = fechaObj.toLocaleDateString('es-ES', { weekday: 'short' }).replace('.','');
                    const numSem = obtenerNumeroSemana(principal.dia, principal.mes, principal.anio);
                    const labelSemana = numSem > 0 ? `S${numSem}` : '-';

                    let displayDia = principal.dia;
                    let isRange = false;
                    const match = principal.texto.match(/^\[(\d+)-(\d+)\]/);
                    if(match) {
                        displayDia = `${match[1]}<span class="date-range-sep">al</span>${match[2]}`;
                        isRange = true;
                    }

                    html += `
                    <div class="day-row">
                        <div class="date-badge">
                            <div class="week-badge">${labelSemana}</div>
                            <span class="date-num" style="${isRange ? 'font-size:1.4em' : ' '}">${displayDia}</span>
                            ${!isRange ? `<span class="date-day">${nombreDia}</span>` : ''}
                        </div>
                        <div class="events-column">
                    `;

                    grupo.forEach(ev => {
                        const txt = ev.texto.replace(/^\[\d+-\d+\]/, '').trim();
                        const bgColor = hexToRgba(ev.color, 0.15);
                        const borderColor = ev.color;

                        html += `
                            <div class="event-item" 
                                 style="background-color: ${bgColor}; border-left: 4px solid ${borderColor};"
                                 onclick="if(isSelectionMode) document.getElementById('chk-${ev.id}').click()">
                                <input type="checkbox" class="select-check" id="chk-${ev.id}" onclick="event.stopPropagation(); handleCheck(${ev.id}, this)">
                                
                                <div class="event-content">
                                    <div class="event-text">
                                        ${txt}
                                        ${(ev.bloquea === 'sí' || ev.bloquea === 'si') ? `<span class="lock-badge" title="Bloquea Evaluaciones">🔒 ${ev.bloques}</span>` : ''}
                                    </div>
                                    ${filtro === 'Todas' ? `<div class="event-cat">${ev.tipo}</div>` : ''}
                                </div>

                                <div class="event-actions">
                                    <button class="btn-mini" style="background:#8e44ad" title="Duplicar" onclick="event.stopPropagation(); abrirModalDuplicar(${ev.id})">❐</button>
                                    <button class="btn-mini" style="background:#95a5a6" title="Editar" onclick="event.stopPropagation(); abrirModalEventos(${ev.id})">✏️</button>
                                    <button class="btn-mini" style="background:#c0392b" title="Borrar" onclick="event.stopPropagation(); borrar(${ev.id})">x</button>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                }
                html += `</div>`;
                card.innerHTML = html;
                contenedor.appendChild(card);
            }
        }
        if(isSelectionMode) document.body.classList.add('mode-select');
    }

    function renderizarCuadricula(filtro) {
        const contenedor = document.getElementById('calendar-grid');
        contenedor.innerHTML = '';
        contenedor.className = ''; 
        actualizarBotonesFiltro(filtro);
        
        document.getElementById('gridMesLabel').innerText = meses[mesCuadriculaVisible];
        
        const anio = 2026;
        const diasEnMes = new Date(anio, mesCuadriculaVisible + 1, 0).getDate();
        const primerDiaSemana = new Date(anio, mesCuadriculaVisible, 1).getDay(); // 0=Sun, 1=Mon...
        
        // Convertir para que Lunes sea 0 y Sábado sea 5 (Domingo = 6)
        let inicioCol = primerDiaSemana === 0 ? 6 : primerDiaSemana - 1;
        
        let html = '<div class="grid-view-container">';
        const cabeceras = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        cabeceras.forEach(c => html += `<div class="grid-view-header">${c}</div>`);
        
        for(let i=0; i<inicioCol; i++) {
            if (i < 6) html += `<div class="grid-view-cell grid-view-empty"></div>`;
        }
        
        const eventosMesExp = [];
        eventos.forEach(ev => {
            if (ev.mes !== mesCuadriculaVisible) return;
            if (filtro !== 'Todas' && ev.tipo !== filtro) return;
            
            const match = ev.texto.match(/^\[(\d+)-(\d+)\]/);
            if (match) {
                const dStart = parseInt(match[1]);
                const dEnd = parseInt(match[2]);
                for(let md = dStart; md <= dEnd; md++) {
                    eventosMesExp.push({ ...ev, diaRender: md });
                }
            } else {
                eventosMesExp.push({ ...ev, diaRender: ev.dia });
            }
        });
        
        let col = inicioCol;
        for(let d=1; d<=diasEnMes; d++) {
            if (col === 6) { 
                col = 0;
                continue; // Saltar domingo
            }
            
            const eventosDia = eventosMesExp.filter(e => e.diaRender === d);
            let evHtml = '';
            
            eventosDia.forEach(ev => {
                const isBloqueado = (ev.bloquea === 'sí' || ev.bloquea === 'si');
                const badge = isBloqueado ? `🔒 ` : '';
                const txtLimpio = ev.texto.replace(/^\[\d+-\d+\]\s*/, '');
                
                evHtml += `<div class="grid-view-event" 
                             style="background-color:${hexToRgba(ev.color,0.2)}; border-left:3px solid ${ev.color};" 
                             title="${txtLimpio}"
                             onclick="abrirModalEventos(${ev.id})">
                             ${badge}${txtLimpio}
                           </div>`;
            });
            
            html += `<div class="grid-view-cell">
                        <div class="grid-view-day-number">${d}</div>
                        ${evHtml}
                     </div>`;
            col++;
        }
        
        while (col > 0 && col < 6) {
            html += `<div class="grid-view-cell grid-view-empty"></div>`;
            col++;
        }
        
        html += '</div>';
        contenedor.innerHTML = html;
        if(isSelectionMode) toggleSelectMode(); // Apagar modo seleccion si entramos a grid
    }

    // --- SELECCION ---
    function toggleSelectMode() {
        isSelectionMode = !isSelectionMode;
        selectedIds.clear(); selectedObjects = [];
        actualizarBarraSeleccion();
        const btn = document.getElementById('btnSelectMode');
        const body = document.body;
        if(isSelectionMode) { btn.classList.add('active'); body.classList.add('mode-select'); } 
        else { btn.classList.remove('active'); body.classList.remove('mode-select'); document.getElementById('selectionBar').classList.remove('visible'); document.querySelectorAll('.select-check').forEach(c => c.checked = false); }
    }
    function handleCheck(id, checkbox) {
        if (checkbox.checked) { selectedIds.add(id); selectedObjects.push(eventos.find(e => e.id === id)); } 
        else { selectedIds.delete(id); selectedObjects = selectedObjects.filter(e => e.id !== id); }
        actualizarBarraSeleccion();
    }
    function actualizarBarraSeleccion() {
        const bar = document.getElementById('selectionBar');
        document.getElementById('selCount').innerText = `${selectedIds.size} seleccionados`;
        if (selectedIds.size > 0) bar.classList.add('visible'); else bar.classList.remove('visible');
    }
    function unificarTexto() {
        if(selectedIds.size < 2) { alert("Selecciona al menos 2 eventos."); return; }
        if(!confirm("¿Igualar texto?")) return;
        const idsArray = Array.from(selectedIds);
        google.script.run.withSuccessHandler(() => { toggleSelectMode(); cargarTodo(); }).unificarEventos(idsArray);
    }
    function fusionarRango() {
        if(selectedIds.size < 2) { alert("Selecciona eventos."); return; }
        selectedObjects.sort((a,b) => (a.mes - b.mes) || (a.dia - b.dia));
        const primero = selectedObjects[0];
        const ultimo = selectedObjects[selectedObjects.length - 1];
        const tagRango = `[${primero.dia}-${ultimo.dia}]`;
        let textoLimpio = primero.texto.replace(/\[.*?\]/g, '').trim();
        const nuevoTexto = `${tagRango} ${textoLimpio}`;
        if(!confirm(`Fusionar ${primero.dia} al ${ultimo.dia}?`)) return;
        const idsBorrar = selectedObjects.slice(1).map(e => e.id);
        const dataEditar = { idEditar: primero.id, fecha: `${primero.anio}-${(primero.mes+1).toString().padStart(2,'0')}-${primero.dia.toString().padStart(2,'0')}`, texto: nuevoTexto, tipo: primero.tipo, tipoNuevo: "", bloquea: true, bloques: "TODOS" };
        google.script.run.withSuccessHandler(() => {
            let borrados = 0;
            const checkFinal = () => { borrados++; if(borrados >= idsBorrar.length) { toggleSelectMode(); cargarTodo(); } };
            if(idsBorrar.length === 0) checkFinal();
            idsBorrar.forEach(id => { google.script.run.withSuccessHandler(checkFinal).borrarEvento(id); });
        }).procesarEvento(dataEditar);
    }

    // --- UI HELPERS ---
    function actualizarBotonesFiltro(filtro) {
        document.querySelectorAll('.btn-filter').forEach(b => {

        async function agregarFilaExterno(nombre='', rut='', motivo='') {
            if (nombre) {
                renderTarjetaExterno(nombre, rut, motivo);
                return;
            }
            
            const { value: formValues } = await Swal.fire({
              title: 'Añadir Invitado Externo',
              html:
                '<input id="swal-ext-nombre" class="swal2-input" placeholder="Nombre Completo" style="width: 80%;">' +
                '<input id="swal-ext-rut" class="swal2-input" placeholder="RUT (ej: 12.345.678-9)" style="width: 80%;">' +
                '<input id="swal-ext-motivo" class="swal2-input" placeholder="¿A qué viene?" style="width: 80%;">',
              focusConfirm: false,
              showCancelButton: true,
              confirmButtonText: 'Añadir',
              cancelButtonText: 'Cancelar',
              preConfirm: () => {
                const n = document.getElementById('swal-ext-nombre').value;
                const r = document.getElementById('swal-ext-rut').value;
                const m = document.getElementById('swal-ext-motivo').value;
                if (!n || !r || !m) {
                    Swal.showValidationMessage('Por favor completa todos los campos');
                    return false;
                }
                return { n, r, m };
              }
            });

            if (formValues) {
                renderTarjetaExterno(formValues.n, formValues.r, formValues.m);
            }
        }

        function renderTarjetaExterno(nombre, rut, motivo) {
            const container = document.getElementById('listaExternos');
            const id = 'ext_' + Date.now() + Math.floor(Math.random()*1000);
            const html = `
              <div class="card mb-2 fila-externo" id="${id}" data-nombre="${nombre}" data-rut="${rut}" data-motivo="${motivo}" style="border-left: 4px solid #0d6efd;">
                <div class="card-body p-2 d-flex justify-content-between align-items-center">
                  <div>
                    <h6 class="mb-0 fw-bold text-dark" style="font-size:0.9rem;"><i class="bi bi-person-badge text-primary"></i> ${nombre}</h6>
                    <small class="text-muted" style="font-size:0.75rem;"><b>RUT:</b> ${rut} &bull; <b>Motivo:</b> ${motivo}</small>
                  </div>
                  <button type="button" class="btn btn-sm btn-outline-danger border-0" onclick="document.getElementById('${id}').remove()">
                     <i class="bi bi-trash-fill"></i>
                  </button>
                </div>
              </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        }

        function recopilarExternos() {
            const filas = document.querySelectorAll('.fila-externo');
            const externos = [];
            filas.forEach(f => {
                externos.push({
                    nombre: f.dataset.nombre,
                    rut: f.dataset.rut,
                    motivo: f.dataset.motivo
                });
            });

      function renderizarCheckboxesCursos(cursosDB) {

      }

      function recopilarCursosAfectados() {
          const checks = document.querySelectorAll('.chk-curso');
          if (checks.length === 0) return 'TODOS';
          
          let todosChecked = true;
          const seleccionados = [];
          checks.forEach(c => {
              if (c.checked) seleccionados.push(c.value);
              else todosChecked = false;
          });

          if (todosChecked) return 'TODOS';
          if (seleccionados.length === 0) return 'NINGUNO';
          return seleccionados.join(', ');
      }

      function toggleBloques() {
        const check = document.getElementById('checkBloquea');
        const area = document.getElementById('areaBloques');
        if(check.checked) area.classList.remove('hidden');
        else area.classList.add('hidden');
    }
    function toggleTodosBloques() {
        const isTodos = document.getElementById('checkTodosBloques').checked;
        document.querySelectorAll('.bloque-cb').forEach(cb => cb.disabled = isTodos);
    }
    function obtenerValoresBloques() {
        if (!document.getElementById('checkBloquea').checked) return "";
        if (document.getElementById('checkTodosBloques').checked) return "TODOS";
        const seleccionados = Array.from(document.querySelectorAll('.bloque-cb:checked')).map(cb => cb.value);
        return seleccionados.join(", ");
    }
    function setValoresBloques(bloquea, bloques) {
        const checkBloquea = document.getElementById('checkBloquea');
        const checkTodos = document.getElementById('checkTodosBloques');
        const cbs = document.querySelectorAll('.bloque-cb');
        
        const isBloqueado = (bloquea === 'sí' || bloquea === 'si');
        checkBloquea.checked = isBloqueado;
        toggleBloques();
        
        if (isBloqueado) {
            if (bloques === 'TODOS' || !bloques) {
                checkTodos.checked = true;
                cbs.forEach(cb => { cb.checked = false; cb.disabled = true; });
            } else {
                checkTodos.checked = false;
                const arr = bloques.split(',').map(s => s.trim());
                cbs.forEach(cb => { cb.disabled = false; cb.checked = arr.includes(cb.value); });
            }
        } else {
            checkTodos.checked = false;
            cbs.forEach(cb => { cb.checked = false; cb.disabled = false; });
        }
    }

    function toggleTodo(source) { document.querySelectorAll('.mes-check').forEach(c => c.checked = source.checked); }

    function ejecutarExportacion(tipo) {
        const checks = document.querySelectorAll('.mes-check:checked');
        const mesesIds = Array.from(checks).map(c => parseInt(c.value)); // Índices de los meses seleccionados
        
        if(mesesIds.length === 0) { alert("Selecciona al menos un mes."); return; }
        
        if(tipo === 'print') {
            // --- LÓGICA DE IMPRESIÓN (PDF) ---
            document.querySelectorAll('.month-card').forEach(c => c.style.display = 'none');
            mesesIds.forEach(id => { const c = document.getElementById(`card-month-${id}`); if(c) c.style.display = 'block'; });
            cerrarModal('modalExportar');
            setTimeout(() => { 
                window.print(); 
                document.querySelectorAll('.month-card').forEach(c => c.style.display = 'flex'); 
            }, 500);
            
        } else {
            // --- LÓGICA EXCEL .XLSX CON COLORES ---
            
            // 1. Mapear eventos
            const eventosMap = {};
            const coloresMap = {}; // Para guardar qué color usar en ese día
            
            eventos.forEach(ev => {
                if(!mesesIds.includes(ev.mes)) return;
                
                let textoLimpio = ev.texto.replace(/^\[\d+-\d+\]/, '').trim(); 
                
                if(!eventosMap[ev.mes]) eventosMap[ev.mes] = {};
                if(!coloresMap[ev.mes]) coloresMap[ev.mes] = {};
                
                if(!eventosMap[ev.mes][ev.dia]) {
                    eventosMap[ev.mes][ev.dia] = [];
                    coloresMap[ev.mes][ev.dia] = ev.color; // Guardamos el color del primer evento
                }
                eventosMap[ev.mes][ev.dia].push(textoLimpio);
            });

            // 2. Definir Estilos Base
            const styleHeader = {
                font: { bold: true, color: { rgb: "FFFFFF" } },
                fill: { fgColor: { rgb: "2C3E50" } },
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: {style:'thin'}, bottom: {style:'thin'}, left: {style:'thin'}, right: {style:'thin'} }
            };
            
            const styleDia = {
                alignment: { horizontal: "center", vertical: "center" },
                border: { top: {style:'thin'}, bottom: {style:'thin'}, left: {style:'thin'}, right: {style:'thin'} }
            };
            
            const styleEventoBase = {
                alignment: { wrapText: true, vertical: "center" },
                border: { top: {style:'thin'}, bottom: {style:'thin'}, left: {style:'thin'}, right: {style:'thin'} }
            };

            // 3. Construir la Data para Excel
            // La librería trabaja con un array de arrays (filas)
            let ws_data = [];
            let rowHeader1 = [];
            let rowHeader2 = [];
            
            // --- CABECERAS ---
            mesesIds.forEach(mId => {
                // Fila 1: Nombres de Meses (ocuparán 3 columnas c/u)
                rowHeader1.push({ v: meses[mId].toUpperCase(), s: styleHeader });
                rowHeader1.push({ v: "", s: styleHeader });
                rowHeader1.push({ v: "", s: styleHeader });
                
                // Fila 2: Subtítulos
                rowHeader2.push({ v: "Nº", s: styleDia });
                rowHeader2.push({ v: "Día", s: styleDia });
                rowHeader2.push({ v: "Evento", s: styleDia });
            });
            ws_data.push(rowHeader1);
            ws_data.push(rowHeader2);

            // --- FILAS DE DÍAS (1 al 31) ---
            const letrasDias = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
            
            for (let dia = 1; dia <= 31; dia++) {
                let rowData = [];
                
                mesesIds.forEach(mesIndex => {
                    const fecha = new Date(2026, mesIndex, dia);
                    
                    if (fecha.getMonth() === mesIndex && fecha.getDate() === dia) {
                        const letra = letrasDias[fecha.getDay()];
                        let texto = "";
                        let colorHex = "FFFFFF"; // Blanco por defecto
                        
                        if(eventosMap[mesIndex] && eventosMap[mesIndex][dia]) {
                            texto = eventosMap[mesIndex][dia].join(" / ");
                            // Quitamos el # del hex
                            colorHex = (coloresMap[mesIndex][dia] || "#ffffff").replace('#', '');
                        }

                        // Estilo dinámico para la celda del evento
                        const styleEvento = JSON.parse(JSON.stringify(styleEventoBase)); // Clonar estilo
                        if(texto !== "") {
                            styleEvento.fill = { fgColor: { rgb: colorHex } };
                            // Si el fondo es muy oscuro, poner letra blanca (opcional, aquí simple)
                            // styleEvento.font = { color: { rgb: "000000" } }; 
                        }

                        // Columna Nº
                        rowData.push({ v: dia, s: styleDia });
                        // Columna Letra
                        rowData.push({ v: letra, s: styleDia });
                        // Columna Evento (Con Color!)
                        rowData.push({ v: texto, s: styleEvento });
                        
                    } else {
                        // Día no válido (ej: 31 Feb) -> Celdas vacías con borde
                        rowData.push({ v: "", s: styleDia });
                        rowData.push({ v: "", s: styleDia });
                        rowData.push({ v: "", s: styleEventoBase });
                    }
                });
                ws_data.push(rowData);
            }

            // 4. Crear Workbook y Worksheet
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(ws_data);

            // 5. MERGE (Combinar Celdas de los títulos de Meses)
            // Cada mes ocupa 3 columnas. Mes 0: cols 0-2, Mes 1: cols 3-5...
            const merges = [];
            mesesIds.forEach((_, index) => {
                const startCol = index * 3;
                merges.push({ s: { r: 0, c: startCol }, e: { r: 0, c: startCol + 2 } });
            });
            ws['!merges'] = merges;

            // 6. Ancho de Columnas
            const cols = [];
            mesesIds.forEach(() => {
                cols.push({ wch: 4 });  // Nº
                cols.push({ wch: 4 });  // Letra
                cols.push({ wch: 30 }); // Evento
            });
            ws['!cols'] = cols;

            XLSX.utils.book_append_sheet(wb, ws, "Calendario 2026");

            // 7. Descargar
            XLSX.writeFile(wb, "Calendario_UTP_2026_Color.xlsx");
            cerrarModal('modalExportar');
        }
    }

        fecha: this.fecha.value, 
        texto: this.texto.value,

        tipoNuevo: this.tipoNuevo.value,

    }));

    if (espChecks.length > 0 || matChecks.length > 0) {

        };

        }).catch(console.error);
    }
    
    google.script.run.withSuccessHandler(() => { 
        cerrarModal('modalEvento'); 
        cargarTodo(); 
        btn.innerText = txtOriginal; 
        btn.disabled = false; 
    }).procesarEvento(datos); 
};
