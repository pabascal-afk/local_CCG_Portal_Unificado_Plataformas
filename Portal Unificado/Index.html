<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Portal Unificado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body, html { height: 100%; margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
    #sidebar { width: 250px; background-color: #2c3e50; color: white; height: 100vh; float: left; display: flex; flex-direction: column; }
    #content { height: 100vh; overflow: hidden; background-color: #f8f9fa; }
    iframe { width: 100%; height: 100%; border: none; }
    .nav-link { color: #cbd5e1; padding: 15px 20px; border-radius: 0; transition: all 0.3s; display: block; }
    .nav-link:hover, .nav-link.active { color: white; background-color: #34495e; }
    .nav-link i { margin-right: 10px; }
    .brand { padding: 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #34495e; margin-bottom: 10px; }
    .d-none { display: none !important; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="brand">
      <i class="bi bi-diagram-3-fill"></i> Portal Colegio
    </div>
    <ul class="nav flex-column mb-auto">
      <li class="nav-item">
        <a href="#" class="nav-link active" onclick="loadApp('evaluaciones', this)" id="nav-evaluaciones">
          <i class="bi bi-journal-check"></i> Calendario Pruebas
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link" onclick="loadApp('calendario', this)" id="nav-calendario">
          <i class="bi bi-calendar-event"></i> Calendario Académico
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link" onclick="loadApp('horarios', this)" id="nav-horarios">
          <i class="bi bi-clock-history"></i> Visor de Horarios
        </a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link" onclick="loadApp('recursos', this)" id="nav-recursos">
          <i class="bi bi-building"></i> Reserva de Recursos
        </a>
      </li>
      <li class="nav-item d-none" id="nav-usuarios-container">
        <a href="#" class="nav-link" onclick="loadApp('usuarios', this)" id="nav-usuarios">
          <i class="bi bi-people"></i> Gestión de Usuarios
        </a>
      </li>
    </ul>
    <div class="p-3 text-center text-secondary" style="font-size: 0.8rem;" id="info-usuario">
      Cargando usuario...
    </div>
  </div>

  <div id="content">
    <iframe id="appFrame" src=""></iframe>
  </div>

  <script>
    let urls = {};
    let contexto = {};
    
    document.addEventListener('DOMContentLoaded', function() {
      // 1. Cargar contexto del usuario (Rol)
      google.script.run.withSuccessHandler(function(ctx) {
        contexto = ctx;
        document.getElementById('info-usuario').innerText = ctx.email + '\n' + ctx.rol;
        
        // Mostrar panel de usuarios solo si es Admin/Directivo
        const rolNormalizado = ctx.rol.toLowerCase();
        if (rolNormalizado === 'administrador' || rolNormalizado === 'admin' || rolNormalizado === 'directivo general') {
          document.getElementById('nav-usuarios-container').classList.remove('d-none');
        }
        
        // 2. Cargar URLs y abrir la primera
        google.script.run.withSuccessHandler(function(data) {
          urls = data;
          document.getElementById('nav-evaluaciones').click();
        }).obtenerUrls();
        
      }).getContextoUsuario();
    });

    function loadApp(appName, element) {
      if (!urls[appName]) return;
      document.getElementById('appFrame').src = urls[appName];
      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>
